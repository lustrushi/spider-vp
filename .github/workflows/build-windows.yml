name: Build Windows demo

on:
  workflow_dispatch:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        working-directory: flutter_app
        run: flutter create --platforms=windows .

      - name: Configure frameless window with transparent native background
        working-directory: flutter_app
        shell: pwsh
        run: |
          $mainPath = "windows/runner/main.cpp"
          $main = Get-Content $mainPath -Raw

          $main = [regex]::Replace(
            $main,
            'Win32Window::Point origin\([^;]*\);',
            'Win32Window::Point origin((GetSystemMetrics(SM_CXSCREEN) - 440) / 2, (GetSystemMetrics(SM_CYSCREEN) - 820) / 2);'
          )
          $main = [regex]::Replace(
            $main,
            'Win32Window::Size size\([^;]*\);',
            'Win32Window::Size size(440, 820);'
          )
          if ($main -notmatch 'Win32Window::Size size\(440, 820\);') {
            throw "Could not set the native window size in $mainPath"
          }
          Set-Content -Path $mainPath -Value $main -NoNewline

          $windowPath = "windows/runner/win32_window.cpp"
          $window = Get-Content $windowPath -Raw
          if ($window -notmatch 'WS_OVERLAPPEDWINDOW') {
            throw "Could not find the default window style in $windowPath"
          }
          $window = $window.Replace('WS_OVERLAPPEDWINDOW', 'WS_POPUP')

          $backgroundPattern = '(?m)(\w+\.hbrBackground\s*=\s*)[^;]*;'
          if ($window -notmatch $backgroundPattern) {
            throw "Could not find the native window background in $windowPath"
          }

          $window = [regex]::Replace(
            $window,
            $backgroundPattern,
            '${1}static_cast<HBRUSH>(GetStockObject(NULL_BRUSH));',
            1
          )

          if ($window -notmatch 'hbrBackground\s*=\s*static_cast<HBRUSH>\(GetStockObject\(NULL_BRUSH\)\);') {
            throw "Could not set a transparent native class background in $windowPath"
          }

          Set-Content -Path $windowPath -Value $window -NoNewline

          $dartPath = "lib/main.dart"
          $dart = Get-Content $dartPath -Raw
          $backgroundCall = 'await windowManager\.setBackgroundColor\([^;]*\);'
          if ($dart -notmatch $backgroundCall) {
            throw "Could not find the window background setting in $dartPath"
          }

          $dart = [regex]::Replace(
            $dart,
            $backgroundCall,
            'await windowManager.setBackgroundColor(const Color(0x00000000));',
            1
          )

          Set-Content -Path $dartPath -Value $dart -NoNewline

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Windows app
        working-directory: flutter_app
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SpiderVPN-Windows-Demo
          path: flutter_app/build/windows/x64/runner/Release/
          if-no-files-found: error
